name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Also checks that the Gradle wrapper jar is the genuine one.
      - uses: gradle/actions/setup-gradle@v6

      - name: Install the Android 17 SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Build and lint
        run: ./gradlew assembleDebug assembleRelease lint

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error
